name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env

      - run: npm ci
      - run: npm run prepare
      - run: npm run lint
      - run: npm run check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prepare
      - run: npm run test:unit -- --run

